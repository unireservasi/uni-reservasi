<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Lihat pilihan kamar apartemen Uni Reservasi Balikpapan lengkap dengan harga, fasilitas, dan kapasitas tamu." />
        <link rel="icon" href="../assets/img/logo.png" />
        <link rel="stylesheet" href="style.css" />
        <!-- font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

        <!-- AOS -->
        <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
        <title>Uni Reservasi | Kamar Page</title>
    </head>
    <body>
        <div id="loading-screen">
            <div class="container">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        <header>
            <div class="navbar">
                <div class="navbar-logo">
                    <img src="../assets/img/logo.png" alt="" />
                </div>

                <div class="navbar-menu">
                    <a href="../index.html">Beranda</a>
                    <a href="#">Kamar</a>
                    <a href="../#fasilitas">Fasilitas</a>
                    <a href="#footer">Kontak</a>
                </div>

                <div class="hamburger-menu" id="hamburger-menu">
                    <img src="../assets/icons/hamburger-icon.png" alt="" />
                </div>
                <div class="reservasi-button">
                    <img src="../assets/icons/whatsapp-icon-white.png" alt="">
                    <a href="https://wa.me/6287779337763">Reservasi</a>
                </div>
        </header>

        <main>
            <section class="kamar">
                <div class="kamar-header">
                    <h1>Kamar</h1>
                    <div class="lokasi-halaman">
                        <a href="../index.html">Beranda</a>
                        <p>></p>
                        <a id="lokasi-halaman">Kamar</a>
                    </div>
                </div>
                <div class="list-kamar" id="list-kamar">
                </div>
            </section>
            <!-- Footer Section -->
            <footer
                class="footer"
                id="footer"
                data-aos="fade-up"
                data-aos-duration="800"
                data-aos-easing="linear"
            >
                <div class="footer-container" id="footer">
                    <div class="footer-header">
                        <img
                            src="../assets/img/logo.png"
                            alt="Logo Uni Reservasi"
                        />
                        <div class="footer-header-text">
                            <h1>Uni Reservasi</h1>
                            <h2>Apartemen & Hotel Balikpapan</h2>
                        </div>
                    </div>
                    <div class="footer-content">
                        <div class="footer-contact">
                            <img
                                src="../assets/icons/phone-icon.png"
                                alt="Phone Icon"
                            />
                            <div class="contact" id="contact"></div>
                        </div>
                        <div class="footer-location">
                            <img
                                src="../assets/icons/location-icon.png"
                                alt="Location Icon"
                            />
                            <p>Jl. Jenderal Sudirman No. 1, Klandasan Ilir, Balikpapan Kota, Kota Balikpapan, Kalimantan Timur</p>
                        </div>
                    </div>
                    <div class="footer-social-media">
                        <img
                            src="../assets/icons/facebook-icon.png"
                            alt="Facebook Icon"
                        />
                        <img
                            src="../assets/icons/instagram-icon.png"
                            alt="Instagram Icon"
                        />
                        <img
                            src="../assets/icons/whatsapp-icon.png"
                            alt="Whatsapp Icon"
                        />
                    </div>
                </div>
            </footer>
        </main>

        <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script defer src="https://unpkg.com/aos@next/dist/aos.js"></script>
        <script defer src="script.js"></script>
    </body>
</html>
